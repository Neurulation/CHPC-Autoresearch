iteration: 1
project: anp_datasets
status: completed
goal: >
  MNIST-Video — stack N same-class MNIST frames into short video sequences.
  No new data download required. Implement as a PyTorch Dataset with configurable
  sequence length. Validate tensor shapes and dataloader compatibility.

phases:
  plan:
    completed_at: "2026-04-12"
    notes: >
      Simplest temporal extension of MNIST. Groups samples by digit class, samples
      seq_len frames with replacement. Sequences are shuffled so classes interleave.
      Establishes temporal dataloading pipeline before NMNIST and real event data.

  survey:
    completed_at: "2026-04-12"
    notes: >
      No special library needed. PyTorch Dataset + torchvision MNIST.
      Random seed for reproducible index pre-build. Sequence label = shared digit class.

  implement:
    completed_at: "2026-04-12"
    notes: >
      Created src/autoresearch/datasets/mnist_video.py — MNISTVideo class.
      Returns (seq_len, C, H, W) float tensor + int label per sample.
      Exported from datasets/__init__.py.

  validate:
    completed_at: "2026-04-12"
    notes: >
      Local validation passed. Train: 60,000 seqs × (8,1,28,28) float32 in [0,1].
      Test: 10,000 seqs × (4,1,28,28). DataLoader batch shape (32,8,1,28,28).
      Labels are int, shapes match at every index tested. All assertions passed.
