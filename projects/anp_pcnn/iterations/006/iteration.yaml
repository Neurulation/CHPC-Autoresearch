project: anp_pcnn
iteration: 6
status: completed
goal: >
  PC-EncDec (proto-SPCNN) — bidirectional predictive coding with explicit
  top-down decoder weights alongside the bottom-up encoder. Creates a full
  generative model on MNIST:
    Encoder: x → r_1 → r_2 → classification (CE head)
    Decoder: r_2 → r_1_pred, r_1 → x_hat (input reconstruction)
  PC Energy = enc_errors + 0.5 * dec_errors + 1.0 * CE
  Skip connections via shared representations: each r_l minimises both
  encoder (bottom-up) and decoder (top-down) prediction errors simultaneously.
  This is the PC analogue of U-Net skip connections. Establishes the
  proto-SPCNN rate-coded baseline before spiking extension (Phase B).
created: "2026-04-11"
phase_history:
  - phase: planned
    completed: "2026-04-11"
    notes: >
      Planned as the convergence point of anp_rnn and anp_pcnn roadmaps.
      After PC-RNN (iter 5) establishes temporal PC, PC-EncDec adds the
      bidirectional/generative structure needed for the proto-SPCNN milestone.
      Follows from human_direction Iter 3: PC enc-dec (project.yaml).
  - phase: survey
    completed: "2026-04-11"
    notes: >
      Bidirectional PC: Rao & Ballard (1999) top-down predictions + Friston
      (2005) free energy principle. U-Net skip connections (Ronneberger 2015)
      as analogue. Design: explicit W_dec[j] mapping r_{j+1}→r_j (top-down).
      dec_weight=0.5 (decoder has half weight of encoder — prevents decoder
      from dominating inference). Adam eps=0.01 retained from iter 4.
      max_grad_norm=0.5 retained. T_pc=20, lr_pc=0.05 (same as PC-FFNN v4).
  - phase: implement
    completed: "2026-04-11"
    notes: >
      Implemented PCEncDec model (src/autoresearch/models/pc_enc_dec.py):
        enc_layers: [784→256→128→10] (same as PC-FFNN)
        dec_layers: [256→784, 128→256] (explicit top-down decoders)
        cls_head: 128→10 (CE classification head)
      Energy = enc_errors + 0.5*dec_errors. Inference: T_pc gradient steps
      on r_1..r_{L-1} (r_0=x clamped, r_L clamped to one_hot(y) during training).
      Weight update: both enc_layers and dec_layers trained via PC energy.
      Model config: configs/model/pc_enc_dec.yaml (dec_weight=0.5)
      Experiment config: mnist_pc_enc_dec_adam.yaml (30 epochs, 5 seeds)
      PBS script: experiments/anp_pcnn_iter6_pc_enc_dec_adam.pbs (12h, 64gb)
      Smoke test passed: val_loss 2.308→2.277 (2 epochs), 470,948 params.
      Energy ~2.5k/batch (dec reconstruction over 784 dims dominates; expected).
  - phase: experiment
    started: "2026-04-11"
    completed: "2026-04-12"
    notes: >
      Job 7169576 completed. All 5 seeds ran to early stopping (ep 15-21).
      Energy schedule fix confirmed: epoch 1 val_acc ~88% (vs ~31% in failed run).
  - phase: analyze
    completed: "2026-04-12"
    notes: >
      Per-seed best val_acc (at best val_acc checkpoint):
        Seed 0: 93.55% (epoch 10) — early stopped ep 17
        Seed 1: 93.27% (epoch  9) — early stopped ep 16
        Seed 2: 93.20% (epoch 14) — early stopped ep 21
        Seed 3: 92.60% (epoch  8) — early stopped ep 15
        Seed 4: 93.02% (epoch 12) — early stopped ep 19
      Mean: 93.13% ± 0.35%. Best: 93.55% (seed 0). Params: 470,948.
      Train loss increases (0.87→1.58) as Y ramps to 0.5 — energy increasingly
      dominates the gradient budget even as accuracy plateaus.
      Energy spikes at epoch 1 (~5800-6100) then monotonically decreases to ~350
      by end of training. Confirmed the spike = CE training moving encoder while
      decoder is frozen (Y=0 warmup phase).
  - phase: conclude
    completed: "2026-04-12"
    notes: >
      Energy schedule fix (Y*(F/B)+(1-Y)*CE) successfully resolved the original
      <1% CE-gradient problem: val_acc 31%→93.13%. However 93.13% is still 4pp
      below PC-FFNN v3 (97.30%) and lags all other models.
      Root cause of gap: two bugs identified for iter7.
      (1) Train/val mismatch: cls_head trained on pure-feedforward r_2 but at
          val time receives inference-modified r_2 (20 inference steps alter r_2
          to satisfy the energy landscape, drifting from feedforward features).
      (2) Y_max=0.5 too aggressive: at steady state, reconstruction and CE
          compete equally. From a variational perspective this is β=1 (standard
          VAE) — known to produce suboptimal discriminative representations.
          Y=0.1 (β=0.1) will keep CE dominant (90% gradient) with mild
          generative regularisation (10%).
      best_result stays at PC-FFNN v3 (97.30%). Advancing to iter 7 with fixes.
      — CE was <1% of total gradient. Network learned only reconstruction,
      reaching ~33% val_acc after 30 epochs (expected 90%+).
      Root cause: combined_loss = energy + ce_weight*CE where energy is
      batch-summed and CE is per-sample mean. With energy≈200/batch and
      CE≈2.17/sample, ce_weight=1.0 means CE is 0.2% of the loss.
      Fix (job 7169576): scheduled convex combination Y*(F/B)+(1-Y)*CE.
        - Normalize energy by B → per-sample scale
        - Linear ramp Y=0→0.5 over epochs 1-15, hold at 0.5
        - Y=0 at epoch 1 = pure CE: smoke test jumped to 88.53% (vs 8.65%)
      Resubmitted as job 7169576 after clearing CHPC outputs. Currently queued.
experiment:
  config: mnist_pc_enc_dec_adam
  pbs_script: experiments/anp_pcnn_iter6_pc_enc_dec_adam.pbs
  seeds: [0, 1, 2, 3, 4]
  epochs: 30
