project: anp_pcnn
iteration: 5
status: completed
goal: >
  PC-RNN: temporal predictive coding on sequential MNIST (T=28 rows).
  Extends PC-FFNN with recurrent connections — at each timestep t:
    mu_l(t) = f(W_ff[l-1] @ r_{l-1}(t) + W_rec[l-1] @ r_l(t-1))
  Inference: greedy per-timestep gradient descent on representations (T_pc=10,
  warm-started from previous hidden state). Weight update: PC energy (active
  weights, reps detached) + CE head via BPTT. Establishes temporal PC baseline
  as the bridge between PC-FFNN and future spiking PC-RNN (Phase B).
created: "2026-04-11"
phase_history:
  - phase: planned
    completed: "2026-04-11"
    notes: >
      Planned after PC-FFNN energy explosion was diagnosed and fixed (iter 4,
      Adam eps=0.01). PC-RNN is roadmap Iter 2 for the anp_pcnn project.
  - phase: survey
    completed: "2026-04-11"
    notes: >
      Key references: Elman (1990) SRN formulation, Friston (2005) predictive
      coding / free energy, Rao & Ballard (1999) hierarchical PC. Design:
      single recurrent weight matrix W_rec per hidden layer mapping
      r_l(t-1) → r_l(t) prediction. Output layer is feedforward-only (same
      as PC-FFNN). Warm-start from h_prev enables T_pc=10 (vs 20 for PCFFNN)
      since representations are pre-initialised near the energy minimum.
      Adam eps=0.01 applied as precaution against stale v_t explosion.
  - phase: implement
    completed: "2026-04-11"
    notes: >
      Implemented PCRNN model (src/autoresearch/models/pc_rnn.py), model config
      (configs/model/pc_rnn.yaml), experiment config (mnist_pc_rnn_adam.yaml,
      30 epochs, 5 seeds, patience=7 on val_accuracy). PCRNN implements
      pc_loss() and forward() to match train_pcnn.py's expected interface.
      Adam eps=0.01, max_grad_norm=0.5 (same as PC-FFNN v4).
experiment:
  config: mnist_pc_rnn_adam
  pbs_script: experiments/anp_pcnn_iter5_pc_rnn_adam.pbs
  seeds: [0, 1, 2, 3, 4]
  epochs: 30
phase_history:
  - phase: experiment
    completed: "2026-04-11"
    notes: >
      All 5 seeds ran and early-stopped (ep 9-25). Completed on CHPC.
  - phase: analyze
    completed: "2026-04-12"
    notes: >
      Per-seed best val_acc: seed0=14.62%, seed1=9.48%, seed2=10.50%,
      seed3=17.53%, seed4=9.73%. Mean: 12.37% ± 3.55%. All near random (10%).
      Best val_loss 2.30-2.37 ≈ ln(10) = random. Catastrophic failure.
  - phase: conclude
    completed: "2026-04-12"
    notes: >
      FAILED EXPERIMENT. Root cause: meta-gradient interference between
      per-timestep PC inference (T_pc=10 gradient steps on r_l at each t)
      and BPTT through W_rec. The inference steps create non-differentiable
      intermediate representations — the modified r_l(t) values that BPTT
      receives bear no consistent relationship to the unmodified feedforward
      activations, corrupting the recurrent gradient signal completely.
      This is a known challenge in combining PC inference with sequence
      learning: the two learning signals (free-energy and BPTT) compete for
      the same weights without careful separation.
      Implication for roadmap: (1) SPC-RNN (spiking PC-RNN) will face the
      same issue — do not attempt until a fix is designed. (2) SPC-EncDec
      on static MNIST avoids this since there is no temporal recurrence;
      it should be safe to proceed. (3) For the ANP's temporal prediction
      objective, the SPCNN architecture should use a different approach to
      temporal recurrence — e.g., implicit memory via PC inference across
      frames rather than explicit W_rec.
