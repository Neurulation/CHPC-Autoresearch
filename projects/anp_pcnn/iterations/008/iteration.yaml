    completed: "2026-04-12"
    notes: >
      Result: 97.14% ± 0.21%. Training budget alone closed 78% of the gap
      to PC-FFNN v3. The architecture can match feedforward PC with sufficient
      training — but slow convergence remains the bottleneck. Next experiment
      should add cosine LR decay or warmup to accelerate convergence,
      potentially reaching or exceeding PC-FFNN v3 within 30-40 epochs.
