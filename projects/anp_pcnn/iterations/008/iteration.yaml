    completed: "2026-04-12"
    notes: >
      Planned after iter 7 concluded at 96.59% ± 0.28% with all seeds still
      improving at epoch 30. Simply double the training budget; no other
      changes needed — the architecture and fixes are confirmed working.
  - phase: implement
    completed: "2026-04-12"
    notes: >
      New experiment config: mnist_pc_enc_dec_v2_adam_60ep.yaml (epochs=60,
      patience=10). PBS script: anp_pcnn_iter8_pc_enc_dec_v2_adam_60ep.pbs
      (2h walltime — iter 7 took ~35min for 30 epochs, 60 should fit in 75min).
  - phase: experiment
    completed: "2026-04-12"
    notes: >
      Submitted job 7171099 on 2026-04-12 (gpu_1, 2h walltime).
      5 seeds (0-4), experiment=mnist_pc_enc_dec_v2_adam_60ep, epochs=60.
      All 5 seeds completed successfully.
  - phase: analyze
    completed: "2026-04-12"
    notes: >
      Best val_acc per seed: [97.48, 96.93, 97.18, 97.03, 97.07].
      Mean: 97.14% ± 0.21%. Seeds 1 and 2 early-stopped (patience=10 on val_acc).
      Seeds 0/3/4 ran all 60 epochs, still improving near convergence.
      vs iter7 (30ep): +0.55pp (96.59%→97.14%), variance reduced (0.28→0.21).
      vs PC-FFNN v3: gap now only -0.16pp (down from -0.71pp at 30ep).
