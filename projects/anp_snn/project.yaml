name: "ANP - Spiking Neural Networks"
slug: anp_snn
status: active
created: "2026-04-12"
description: >
  Build a complete ANN→SNN progressive ladder toward a fully biologically plausible,
  end-to-end spiking implementation. Every layer must pass binary spikes {0,1} with
  no continuous-valued hidden states between layers — spike-in, spike-out throughout,
  enabling theoretical deployment on neuromorphic hardware.

  Architecture ladder (snntorch primitives):
    SFNN       snn.Leaky per FC layer                iter 2  DONE ✓
    SCNN       snn.Leaky after each conv              iter 1  DONE ✓
    SRNN       snn.RLeaky (recurrent LIF, T=28)       iter 11 planned
    SLSTM      snn.SLSTM (spiking LSTM cell, T=28)    iter 12 planned
    SGRU       custom LIF-gated GRU                   deferred — no snntorch native
    STransformer  custom/research-level               deferred

  Phase B/C (iters 3–10) used a HYBRID architecture: snn.Leaky encoder +
  standard nn.LSTM/GRU/RNN. These are NOT the target fully spiking design.
  They serve as comparison baselines (do spike-encoded inputs help standard RNNs?).

  Later phases will replace BPTT with local learning rules (Hebbian, STDP) for full
  biological plausibility with no backpropagation.
current_iteration: 10
branch: "project/anp-snn"
human_direction: >
  Research goal: a strictly biologically plausible, end-to-end spiking model.
  Three hard requirements:
    1. No backpropagation eventually — local learning rules (Hebbian/STDP).
    2. Fully spike-driven — every layer outputs binary {0,1} spikes; no float
       hidden states between layers.
    3. Theoretically deployable on neuromorphic / energy-efficient hardware.

  Immediate next: implement truly fully spiking recurrent models (new iterations):
    iter 11: SRNN rate  — snn.RLeaky(linear_features=256) over T=28 MNIST rows
    iter 12: SLSTM rate — snn.SLSTM(28, 256) over T=28 MNIST rows
    iter 13: SRNN TTFS  — same as iter 11 with TTFS input encoding
    iter 14: SLSTM TTFS — same as iter 12 with TTFS input encoding

  iters 3–10 (hybrid) should be allowed to complete as comparison baselines.
  Do NOT rerun them — their data answers a separate question (spiking input encoding
  vs standard RNN) that is still scientifically useful.

  Do NOT implement spiking GRU or spiking Transformer yet (no native snntorch support).
