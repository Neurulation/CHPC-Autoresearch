iteration: 2
project: anp_snn
status: completed
goal: >
  SNN-FFNN (rate coding) — spiking analogue of the FFNN baseline (99.17% ± 0.10%).
  784→512→256→10 fully-connected LIF network (SNNBaseline). T=25 Bernoulli timesteps.
  Already implemented. Establishes the spiking FFNN Phase B baseline.

phases:
  plan:
    completed_at: "2026-04-12"
    notes: >
      SNNBaseline was implemented at the start of the ANP project as the
      Phase 1 source network. Repurposed here as the Phase B SNN-FFNN baseline.
      Config: mnist_snn_baseline_adam.yaml (20ep, patience=5, 5 seeds, Adam lr=1e-3).

  implement:
    completed_at: "2026-04-12"
    notes: >
      Already implemented: src/autoresearch/models/snn_baseline.py (SNNBaseline).
      Config: src/autoresearch/configs/model/snn_baseline.yaml.
      Experiment: src/autoresearch/configs/experiment/mnist_snn_baseline_adam.yaml.
      PBS script: experiments/anp_snn_iter2_snn_ffnn_adam.pbs.

  experiment:
    started_at: "2026-04-12"
    completed_at: "2026-04-12"
    notes: >
      Submitted anp_snn_iter2_snn_ffnn_adam.pbs to CHPC gpu_1 queue.
      5 seeds (0–4), 20 epochs each, early stopping patience=5 on val_loss.
      All 5 seeds completed. Data from original anp_phase1_snn_baseline run.

  analyze:
    completed_at: "2026-04-12"
    notes: >
      All 5 seeds completed. Best val_acc per seed: [97.55, 97.47, 97.72, 97.62, 97.75].
      Mean: 97.62% ± 0.12% (std). Avg 11.4 epochs before early stopping.
      vs non-spiking FFNN (784-256-128-10): 98.06% ± 0.15% → gap = -0.44pp.
      Note: SNN uses larger hidden dims (512-256 vs 256-128), yet still slightly lower.
      Rate coding (T=25 Bernoulli) incurs only a small accuracy cost on static MNIST.

  conclude:
    completed_at: "2026-04-12"
    notes: >
      Result: SNN-FFNN 97.62% ± 0.12% (rate coding, T=25).
      Phase B spiking FFNN baseline established. Rate coding preserves ~99.5% of
      non-spiking performance on MNIST. This is the floor for Phase C (TTFS) comparison.
      Next: compare TTFS-FFNN (iter 6 by plan). Hypothesis: TTFS ≥ rate coding on
      static images due to more precise temporal representation.
