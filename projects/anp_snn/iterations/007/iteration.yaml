iteration: 7
project: anp_snn
status: completed
goal: >
  SNN-CNN TTFS (Phase C) — temporal coding variant of the rate-coded SNN-CNN (iter 1, 98.87%±0.13%).
  TTFS applied to full image: each spatial pixel fires at most once over T=25 timesteps.
  Spatial feature extraction with temporal spike timing rather than rate-coded spike counts.
  Tests: does TTFS preserve spatial-feature-extraction advantage of convolutional spiking layers?

phases:
  plan:
    completed_at: "2026-04-12"
    notes: >
      CNN is the strongest Phase B result (98.87%), making it the most important TTFS comparison.
      TTFS applied globally to the image (not per-row) — each pixel fires at most once.
      LIF convolutions process TTFS spike trains; output is spike-count logits (sum over T).

  implement:
    completed_at: "2026-04-12"
    notes: >
      Modified src/autoresearch/models/snn_cnn.py: added encoding='rate'/'ttfs' param.
      _rate_encode replaced by _encode() that dispatches to rate_encode/ttfs_encode.
      Created src/autoresearch/configs/model/snn_cnn_ttfs.yaml (encoding: ttfs).
      Created src/autoresearch/configs/experiment/mnist_snn_cnn_ttfs_adam.yaml.
      Created experiments/anp_snn_iter7_snn_cnn_ttfs_adam.pbs (gpu_1, 1h).

  experiment:
    started_at: "2026-04-12"
    completed_at: "2026-04-12"
    notes: >
      Submitted to CHPC gpu_1 as job 7171614. 5 seeds (0–4), 20 epochs, patience=5 on val_loss.
      Seeds 0-3 ran to epoch 20; seed4 early stopped at epoch 12 (valid result: 98.20%).
      Seed4 status.json anomalous (in_progress) but wandb summary valid.

  analyze:
    completed_at: "2026-04-12"
    notes: >
      metrics.json written. Mean val_acc=98.41%+-0.17% (5 seeds).
      Comparison: SNN-CNN rate (iter1) = 98.87%+-0.13%. TTFS is -0.46pp worse.
      Pattern: TTFS consistently -0.46-0.49pp vs rate across both FFNN and CNN.

  conclude:
    completed_at: "2026-04-12"
    notes: >
      TTFS encoding is WORSE than rate coding for SNN-CNN on static MNIST (-0.46pp).
      The -0.46pp (CNN) and -0.49pp (FFNN) gaps are remarkably consistent, suggesting
      the penalty is a function of the ENCODING scheme, not the downstream architecture.
      Root cause: TTFS converts pixel intensity to firing time, but LIF integration does
      not exploit temporal ordering — it simply sums spikes, making TTFS equivalent to
      a binarized image (threshold: pixel bright enough to fire within T steps). This
      discards intensity gradients that rate coding preserves via Bernoulli sampling.
      Conclusion: For static MNIST, rate > TTFS by ~0.47pp regardless of architecture.
