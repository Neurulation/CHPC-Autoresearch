iteration: 3
project: anp_spcnn
status: completed
goal: >
  SPC-FFNN v2 — fix train/val mismatch bug from iter 2.
  Bug: CE was computed on raw linear activations (no SNN), eval on SNN spike-count reps.
  Fix 1: pc_loss() CE now uses reps_init[-2] from _bottom_up() (SNN representations).
  Fix 2: forward() uses pure-feedforward SNN (no PC inference) to match training.
  Same fix class as PC-EncDec v2 (anp_pcnn iter 7, +3.46pp).

phases:
  plan:
    completed_at: "2026-04-12"
    notes: >
      Root cause of iter 2 failure: CE gradient path uses raw x_flat→layers[:-1]
      (bypassing SNN entirely), while eval uses SNN spike-counts→PC inference→cls_head.
      Fix: make CE and eval both use the same SNN-feedforward representation.
      Secondary concern: energy explosions at epoch 6. With CE no longer flowing to
      self.layers (detached reps), only PC energy gradient updates layers → no competing
      gradients → explosions should be eliminated or significantly reduced.
      Safety: add max_grad_norm=1.0 to experiment config.

  implement:
    completed_at: "2026-04-12"
    notes: >
      Modified src/autoresearch/models/spc_ffnn.py:
        pc_loss(): replaced raw-activation CE with cls_head(reps_init[-2]).
        forward(): replaced SNN+PC-inference with pure-feedforward SNN only.
      Created src/autoresearch/configs/experiment/mnist_spc_ffnn_v2_adam.yaml (30ep).
      Created experiments/anp_spcnn_iter3_spc_ffnn_v2_adam.pbs (gpu_1, 2h).
      Smoke test: val_acc 39.43% @ep1, 46.72% @ep2 (vs iter2: 10% stuck throughout).
      No energy explosion observed. Fix confirmed working.

  experiment:
    started_at: "2026-04-12"
    completed_at: "2026-04-12"
    notes: >
      Submitted to CHPC gpu_1 as job 7171612. 5 seeds (0–4), 30 epochs, patience=7 on val_loss.
      All 5 seeds completed.

  analyze:
    completed_at: "2026-04-12"
    notes: >
      Iter3 (wrong entry point, job 7171612): WandB results 55.95%±2.78%.
      Iter3b (train_pcnn correct, job 7172276): ALL 5 seeds at chance (val_loss=2.302, epoch 8, early stopped).
      Iter3b CONFIRMS design bug (2) below — even with correct PC training, SPC-FFNN v2 fails.
      Two root causes confirmed:
      (1) PBS SCRIPT BUG: iter3 used train.py not train_pcnn. cls_head on frozen SNN features → 55.95%.
      (2) DESIGN BUG: in v2, SNN outputs detached → CE only updates cls_head; PC energy updates
          self.layers with reconstruction objective. PC energy alone cannot drive discriminative
          feature learning → layers produce random features → cls_head at chance.
      iter3b is the definitive SPC-FFNN v2 result: chance accuracy with train_pcnn.

  conclude:
    completed_at: "2026-04-12"
    notes: >
      COMPLETE FAILURE (iter3b, correct run): ~11% (chance), early stopped epoch 8.
      SPC-FFNN v2 design is fundamentally broken: detached SNN outputs mean CE gradient
      never reaches self.layers. PC energy alone (reconstruction) cannot create discriminative
      features. The 55.95% in iter3 was misleading — that was a linear head on random features
      (wrong entry point), not a PC training result.
      Root cause: PC energy and CE gradient objectives are structurally separated in v2
      (CE → cls_head only; PC energy → self.layers only). Neither objective alone is sufficient.
      Next: iters 4 (Option A: CE through SNN) and 5 (Option D: CE via BPTT) fix gradient routing.
      If those also fail → architectural separation of SNN and PC weights is required.
