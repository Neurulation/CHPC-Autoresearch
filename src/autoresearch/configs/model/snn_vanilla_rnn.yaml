# @package _global_.model
# SNN-VanillaRNN — hybrid spiking vanilla RNN for sequential MNIST.
# LIF input encoder (T=25 Bernoulli timesteps per row) + 2-layer stacked RNN (hidden=256, tanh).
# Direct spiking analogue of the VanillaRNN baseline (97.89%).

_target_: autoresearch.models.snn_vanilla_rnn.SNNVanillaRNNModel
input_size: 28
hidden_size: 256
num_layers: 2
num_classes: 10
beta: 0.9
threshold: 1.0
timesteps: 25
dropout: 0.3
nonlinearity: tanh
