# @package _global_.model
# SNN-GRU — hybrid spiking GRU for sequential MNIST.
# LIF input encoder (T=25 Bernoulli timesteps per row) + 2-layer stacked GRU (hidden=256).
# Direct spiking analogue of the GRU baseline.

_target_: autoresearch.models.snn_gru.SNNGRUModel
input_size: 28
hidden_size: 256
num_layers: 2
num_classes: 10
beta: 0.9
threshold: 1.0
timesteps: 25
dropout: 0.3
