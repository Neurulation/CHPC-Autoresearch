# @package _global_.model
# SNN Baseline — 2-hidden-layer feedforward LIF network for MNIST.
# Rate coding (T=25 timesteps) is applied internally; forward() returns
# spike-count logits compatible with nn.CrossEntropyLoss.

_target_: autoresearch.models.snn_baseline.SNNBaseline
input_size: 784
hidden1: 512
hidden2: 256
num_classes: 10
beta: 0.9
threshold: 1.0
timesteps: 25
flatten_input: true
