# @package _global_.model
# SNN-GRU TTFS — hybrid spiking GRU with time-to-first-spike encoding.
# Phase C: temporal coding variant of the rate-coded SNN-GRU.
# TTFS per row: each pixel fires at most once; bright pixels fire early.

_target_: autoresearch.models.snn_gru.SNNGRUModel
input_size: 28
hidden_size: 256
num_layers: 2
num_classes: 10
beta: 0.9
threshold: 1.0
timesteps: 25
dropout: 0.3
encoding: ttfs
