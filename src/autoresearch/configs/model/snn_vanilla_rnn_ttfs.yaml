# @package _global_.model
# SNN-VanillaRNN TTFS — hybrid spiking RNN with time-to-first-spike encoding.
# Phase C: temporal coding variant of the rate-coded SNN-VanillaRNN.
# TTFS per row: each pixel fires at most once; bright pixels fire early.

_target_: autoresearch.models.snn_vanilla_rnn.SNNVanillaRNNModel
input_size: 28
hidden_size: 256
num_layers: 2
num_classes: 10
beta: 0.9
threshold: 0.9  # must be < 1.0: TTFS spike amplitude=1.0, H(mem-thr)=H(0)=0 if thr=1.0 → silent LIF
timesteps: 25
dropout: 0.3
nonlinearity: tanh
encoding: ttfs
