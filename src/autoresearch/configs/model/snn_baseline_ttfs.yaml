# @package _global_.model
# SNN-FFNN TTFS — feedforward LIF network with time-to-first-spike encoding.
# Phase C: temporal coding variant of the rate-coded SNN baseline.
# TTFS: each pixel fires at most once; bright pixels fire early (t≈0), dark late (t≈T-1).

_target_: autoresearch.models.snn_baseline.SNNBaseline
input_size: 784
hidden1: 512
hidden2: 256
num_classes: 10
beta: 0.9
threshold: 1.0
timesteps: 25
flatten_input: true
encoding: ttfs
