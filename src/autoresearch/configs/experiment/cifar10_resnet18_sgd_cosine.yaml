# @package _global_
# CIFAR-10 + ResNet-18 + SGD+momentum + cosine annealing LR schedule

defaults:
  - override /dataset: cifar10
  - override /model: resnet18
  - override /optimizer: sgd
  - override /loss_fn: cross_entropy
  - override /scheduler: cosine

experiment_group: cifar10_resnet18_sgd_cosine
experiment_name: ${experiment_group}_seed_${seed}
seed: 0
batch_size: 128
epochs: 200
num_workers: 4
validation_split: 0.1

early_stopping:
  enabled: true
  patience: 20
  min_delta: 0.001
  metric: val_loss
  mode: min

hydra:
  sweeper:
    params:
      seed: range(0,5)

wandb:
  tags:
    - cifar10
    - resnet18
    - sgd
    - cosine_annealing
    - cross_entropy
    - iter2
  notes: "ResNet-18 on CIFAR-10 with SGD+momentum and cosine annealing LR schedule"
