# @package _global_
# ANP-SPCNN Iter 3 RE-RUN — SPC-FFNN v2 with CORRECTED entry point.
# Original iter 3 PBS script incorrectly used `python -m autoresearch.train`
# instead of `train_pcnn`. Only cls_head was trained; PC energy never ran.
# This re-run uses train_pcnn.py: PC energy + CE both active (ce_mode='v2').
# Provides the true baseline: does PC energy alone (self.layers via reconstruction,
# cls_head via CE on frozen SNN reps) converge beyond 55.95%?

defaults:
  - override /dataset: mnist
  - override /model: spc_ffnn

experiment_group: mnist_spc_ffnn_v2_pcnn_adam
experiment_name: ${experiment_group}_seed_${seed}
seed: 0
batch_size: 128
epochs: 30
num_workers: 4
validation_split: 0.1
max_grad_norm: 1.0

early_stopping:
  enabled: true
  patience: 7
  min_delta: 0.001
  metric: val_loss
  mode: min

hydra:
  sweeper:
    params:
      seed: range(0,5)

wandb:
  tags:
    - mnist
    - snn
    - pc
    - spc-ffnn
    - lif
    - rate-coding
    - predictive-coding
    - adam
    - anp
    - anp-spcnn
    - train-val-mismatch-fix
    - corrected-entry-point
  notes: "ANP-SPCNN Iter 3 RE-RUN — SPC-FFNN v2 with train_pcnn (correct). Previous run used train.py by mistake."
