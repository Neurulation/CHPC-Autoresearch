# @package _global_
# ANP-PCNN Iter 6b — PC-EncDec (proto-SPCNN) on MNIST — energy schedule fix.
#
# Problem (iter 6 run): raw PC energy is O(B × dims) while CE is O(1) per
# sample. With ce_weight=1.0, CE was <1% of the total gradient → network
# learned only reconstruction, reaching only ~33% val accuracy after 30 epochs.
#
# Fix: scheduled convex combination  Y*(F/B) + (1-Y)*CE
#   - Y=0.0: pure CE — classifier learns first, no energy gradient
#   - Y→max: energy participates once representations are sensible
#   - Normalising by B makes Y a true blend coefficient, not a magnitude hack
#
# Schedule: linear ramp from Y=0 at epoch 1 to Y=max at epoch warmup_epochs,
# then hold. warmup_epochs=15 (half of 30) with max=0.5 (balanced blend).
#
# Adam eps=0.01 retained (prevents energy explosion).
# max_grad_norm=0.5 retained.

defaults:
  - override /dataset: mnist
  - override /model: pc_enc_dec
  - override /optimizer: adam_pc

experiment_group: mnist_pc_enc_dec_adam
experiment_name: ${experiment_group}_seed_${seed}
seed: 0
batch_size: 128
epochs: 30
num_workers: 4
validation_split: 0.1
max_grad_norm: 0.5

model:
  T_pc: 20
  lr_pc: 0.05
  dec_weight: 0.5

energy_schedule:
  max: 0.5
  warmup_epochs: 15

early_stopping:
  enabled: true
  patience: 7
  min_delta: 0.01
  metric: val_accuracy
  mode: max

hydra:
  sweeper:
    params:
      seed: range(0,5)

wandb:
  tags:
    - mnist
    - pc_enc_dec
    - predictive_coding
    - encoder_decoder
    - bidirectional_pc
    - reconstruction
    - skip_connections
    - adam
    - anp
    - anp-pcnn
    - proto_spcnn
    - energy_schedule
  notes: "ANP-PCNN Iter 6b — PC-EncDec energy schedule fix: Y*(F/B)+(1-Y)*CE, linear ramp Y=0→0.5 over 15 epochs."
