# @package _global_
# ANP-PCNN Iter 3 — PC-FFNN v3 on MNIST.
#
# Fix for iter 2 energy explosions (all seeds, epochs 5-11):
#   Gradient clipping (max_grad_norm=0.5) applied after combined_loss.backward()
#   to prevent runaway Adam updates when PC energy enters high-curvature regions.
#
# Inherits iter 2 fixes:
#   1. CE classification head on r_{L-1} for calibrated logits.
#   2. Early stopping on val_accuracy (mode=max).
#   3. Combined loss: PC energy + ce_weight * CE(cls_head(r_{L-1}), y).

defaults:
  - override /dataset: mnist
  - override /model: pc_ffnn
  - override /optimizer: adam

experiment_group: mnist_pc_ffnn_v3_adam
experiment_name: ${experiment_group}_seed_${seed}
seed: 0
batch_size: 128
epochs: 30
num_workers: 4
validation_split: 0.1
max_grad_norm: 0.5

model:
  T_pc: 20
  lr_pc: 0.05
  ce_weight: 1.0

early_stopping:
  enabled: true
  patience: 7
  min_delta: 0.01
  metric: val_accuracy
  mode: max

hydra:
  sweeper:
    params:
      seed: range(0,5)

wandb:
  tags:
    - mnist
    - pc_ffnn
    - predictive_coding
    - rao_ballard
    - adam
    - anp
    - anp-pcnn
    - ce_head
    - grad_clip
    - v3
  notes: "ANP-PCNN Iter 3 — PC-FFNN v3: CE head + gradient clipping (max_grad_norm=0.5). Fixes energy explosions seen in iter 2."
