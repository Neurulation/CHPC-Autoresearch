# @package _global_
# ANP-PCNN Iter 9 — PC-EncDec v2 + cosine LR decay.
#
# Iter 8 (60ep): 97.14% ± 0.21%, seeds 0/3/4 ran all 60 epochs still improving.
# Slow convergence identified as the primary bottleneck (gap to PC-FFNN v3: -0.16pp).
# Add CosineAnnealingLR: LR decays 1e-3 → 1e-6 over 60 epochs.
# All other hyperparameters identical to iter 8. Fair comparison (same budget).

defaults:
  - override /dataset: mnist
  - override /model: pc_enc_dec
  - override /optimizer: adam_pc

experiment_group: mnist_pc_enc_dec_v2_adam_cosine
experiment_name: ${experiment_group}_seed_${seed}
seed: 0
batch_size: 128
epochs: 60
num_workers: 4
validation_split: 0.1
max_grad_norm: 0.5

model:
  T_pc: 20
  lr_pc: 0.05
  dec_weight: 0.5

energy_schedule:
  max: 0.1
  warmup_epochs: 10

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  eta_min: 1.0e-6

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.01
  metric: val_accuracy
  mode: max

hydra:
  sweeper:
    params:
      seed: range(0,5)

wandb:
  tags:
    - mnist
    - pc_enc_dec
    - predictive_coding
    - encoder_decoder
    - bidirectional_pc
    - reconstruction
    - skip_connections
    - adam
    - cosine_lr
    - anp
    - anp-pcnn
    - proto_spcnn
    - energy_schedule
    - val_fix
  notes: "ANP-PCNN Iter 9 — PC-EncDec v2 + cosine LR: accelerate convergence to close -0.16pp gap."
