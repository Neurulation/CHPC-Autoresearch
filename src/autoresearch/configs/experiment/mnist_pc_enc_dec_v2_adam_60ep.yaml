# @package _global_
# ANP-PCNN Iter 8 — PC-EncDec v2 @ 60 epochs — ceiling run.
#
# Same as iter 7 (pure-feedforward eval + Y_max=0.1) but epochs doubled.
# Iter 7 showed all 5 seeds still improving at epoch 30 (best at 26-30),
# so 30 more epochs should establish the true convergence ceiling.
# Early stopping patience bumped 7→10 to allow longer plateaus.

defaults:
  - override /dataset: mnist
  - override /model: pc_enc_dec
  - override /optimizer: adam_pc

experiment_group: mnist_pc_enc_dec_v2_adam_60ep
experiment_name: ${experiment_group}_seed_${seed}
seed: 0
batch_size: 128
epochs: 60
num_workers: 4
validation_split: 0.1
max_grad_norm: 0.5

model:
  T_pc: 20
  lr_pc: 0.05
  dec_weight: 0.5

energy_schedule:
  max: 0.1
  warmup_epochs: 10

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.01
  metric: val_accuracy
  mode: max

hydra:
  sweeper:
    params:
      seed: range(0,5)

wandb:
  tags:
    - mnist
    - pc_enc_dec
    - predictive_coding
    - encoder_decoder
    - bidirectional_pc
    - reconstruction
    - skip_connections
    - adam
    - anp
    - anp-pcnn
    - proto_spcnn
    - energy_schedule
    - val_fix
    - ceiling_run
  notes: "ANP-PCNN Iter 8 — PC-EncDec v2 @ 60 epochs: establish convergence ceiling."
