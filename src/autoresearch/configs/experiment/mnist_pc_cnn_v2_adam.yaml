# @package _global_
# ANP-PCNN Iter 12 — PC-CNN v2 stabilization.
#
# Changes vs iter11:
#   1) Energy scheduling with per-sample normalization (PC-CNN model now supports energy_weight).
#   2) Less aggressive clipping (0.5 -> 2.0) to avoid extreme update suppression.
#   3) Longer budget (60 epochs) to give stabilized optimization room to converge.

defaults:
  - override /dataset: mnist
  - override /model: pc_cnn
  - override /optimizer: adam_pc

experiment_group: mnist_pc_cnn_v2_adam
experiment_name: ${experiment_group}_seed_${seed}
seed: 0
batch_size: 128
epochs: 60
num_workers: 4
validation_split: 0.1
max_grad_norm: 2.0

model:
  T_pc: 20
  lr_pc: 0.05
  ce_weight: 1.0

energy_schedule:
  max: 0.1
  warmup_epochs: 10

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.01
  metric: val_accuracy
  mode: max

hydra:
  sweeper:
    params:
      seed: range(0,5)

wandb:
  tags:
    - mnist
    - pc_cnn
    - predictive_coding
    - convolutional
    - adam
    - anp
    - anp-pcnn
    - v2
    - energy_schedule
    - grad_clip
  notes: "ANP-PCNN Iter 12 — PC-CNN v2: normalized energy scheduling + relaxed clipping (2.0), 60ep."
