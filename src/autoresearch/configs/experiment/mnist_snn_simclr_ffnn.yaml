# @package _global_
# ANP-Contrastive Iter 3 — SNN SimCLR FFNN on MNIST.
# SNN-FFNN encoder (784→512→256, rate coding T=25) trained with NT-Xent.
# Key question: can binary spike accumulations learn useful contrastive representations?
# Baseline comparison: supervised SNN-FFNN (97.62%).

defaults:
  - override /dataset: mnist
  - override /model: snn_simclr_ffnn
  - override /optimizer: adam

experiment_group: mnist_snn_simclr_ffnn
experiment_name: ${experiment_group}_seed_${seed}
seed: 0
num_workers: 4

# Pre-training (more epochs for SNN: more timesteps per forward pass)
pretrain_epochs: 100
pretrain_batch_size: 128
temperature: 0.5

# Linear probe
probe_epochs: 50
probe_batch_size: 128
probe_lr: 1.0e-2

early_stopping:
  enabled: true
  patience: 15
  min_delta: 0.001

hydra:
  sweeper:
    params:
      seed: range(0,5)

wandb:
  tags:
    - mnist
    - simclr
    - contrastive
    - snn
    - ffnn
    - rate-coding
    - adam
    - anp-contrastive
  notes: "ANP-Contrastive Iter 3 — SNN SimCLR FFNN (784→512→256, T=25 rate coding) on MNIST."
