# @package _global_
# ANP-RNN Iter 3 — Vanilla RNN (Elman) baseline on sequential MNIST (row-level, T=28).
# Structurally identical to LSTM (Iter 1) and GRU (Iter 2) baselines.
# Elman RNN: h_t = tanh(W_ih*x_t + W_hh*h_{t-1}) — no gates, no cell state.
# Fewest parameters of the three architectures; most vulnerable to vanishing gradients.
# Completes the RNN family comparison: LSTM ≥ GRU ≥ Vanilla.

defaults:
  - override /dataset: mnist
  - override /model: vanilla_rnn
  - override /optimizer: adam
  - override /loss_fn: cross_entropy

experiment_group: mnist_vanilla_rnn_adam
experiment_name: ${experiment_group}_seed_${seed}
seed: 0
batch_size: 128
epochs: 30
num_workers: 4
validation_split: 0.1
max_grad_norm: 1.0

early_stopping:
  enabled: true
  patience: 7
  min_delta: 0.001
  metric: val_loss
  mode: min

hydra:
  sweeper:
    params:
      seed: range(0,5)

wandb:
  tags:
    - mnist
    - vanilla_rnn
    - rnn
    - sequential
    - adam
    - cross_entropy
    - anp
    - anp-rnn
  notes: "ANP-RNN Iter 3 — 2-layer Vanilla RNN/Elman (hidden=256) on row-level sequential MNIST (T=28). Rate-coded backprop baseline. No-gate RNN for RNN family comparison."
